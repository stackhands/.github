name: changelog

on:
  workflow_call:
    inputs:
      version-source:
        description: File holding the package version (build.zig.zon, Cargo.toml, or pyproject.toml)
        required: false
        type: string
        default: build.zig.zon

permissions:
  contents: read

jobs:
  draft:
    name: towncrier build --draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The towncrier release eb-local, eb-stack and rfc9162 pin.
      - name: Install towncrier 26.9.0
        run: python -m pip install --disable-pip-version-check 'towncrier==26.9.0'
      - name: Read package version
        id: version
        env:
          VERSION_SOURCE: ${{ inputs['version-source'] }}
        run: |
          set -euo pipefail
          case "$VERSION_SOURCE" in
            build.zig.zon)
              version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
              ;;
            Cargo.toml)
              version=$(sed -n '0,/^version = /s/^version = "\(.*\)"$/\1/p' Cargo.toml)
              ;;
            pyproject.toml)
              version=$(sed -n '0,/^version = /s/^version = "\(.*\)"$/\1/p' pyproject.toml)
              ;;
            *)
              printf 'unsupported version-source: %s\n' "$VERSION_SOURCE" >&2
              exit 2
              ;;
          esac
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Draft the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: towncrier build --draft --version "$VERSION"
      - name: A malformed fragment fails the draft
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name=not-a-fragment.md
          printf '%s\n' 'This name has no fragment type.' > "changelog.d/$name"
          set +e
          out=$(towncrier build --draft --version "$VERSION" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          rm -f "changelog.d/$name"
          test "$code" -ne 0
          printf '%s\n' "$out" | grep -F "Invalid news fragment name: $name"
